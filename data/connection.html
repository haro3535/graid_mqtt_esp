<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wi-Fi Credentials</title>
  <link href="./bootstrap/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg rounded-4">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Connect to Wi-Fi</h3>
            <p class="bg-primary text-white py-2 rounded-4 text-center">Available Wi-Fi Networks</p>
            <div class="card shadow-md mb-3 pe-4" style="max-height: 20vh; overflow-y: scroll;">
              <ul class="list-group">
                <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 1</li>
                <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 2</li>
                <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 3</li>
                <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 4</li>
              </ul>
            </div>
            <form id="wifiForm">
              <div class="mb-3">
                <label for="ssid" class="form-label">SSID</label>
                <input type="text" class="form-control" id="ssid" name="ssid" required hidden>
                <div id="dropbox" class="form-control" style="position: relative;">
                  <p class="w-full">Serhat</p>
                  <div class="d-block card shadow-lg" style="position: absolute; width: 100%; z-index: 10; max-height: 20vh; overflow-y: scroll; margin-left: -0.75rem; margin-top: 0.5rem;">
                    <ul class="list-group" style="">
                      <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 1</li>
                      <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 2</li>
                      <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 3</li>
                      <li class="list-group-item list-group-item-action" style="cursor: pointer;">Network 4</li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>
            </form>
            <div id="responseMessage" class="mt-3 text-center"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("wifiForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const ssid = document.getElementById("ssid").value;
      const password = document.getElementById("password").value;

      fetch("http://192.168.4.1/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ ssid, password })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("responseMessage").innerHTML =
          `<div class="alert alert-success">Success: ${data.message}</div>`;
      })
      .catch(error => {
        console.error("Error:", error);
        document.getElementById("responseMessage").innerHTML =
          `<div class="alert alert-danger">Error sending data.</div>`;
      });
    });


    async function fetchAvailableWiFis() {
      try {
        const response = await fetch("http://192.168.4.1/available-wifis");
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        const wifiList = data.wifis.map(wifi => `<li>${wifi}</li>`).join("");
        document.getElementById("responseMessage").innerHTML =
          `<ul class="list-group">${wifiList}</ul>`;
      } catch (error) {
        console.error("Error fetching Wi-Fi list:", error);
        document.getElementById("responseMessage").innerHTML =
          `<div class="alert alert-danger">Error fetching Wi-Fi list.</div>`;
      }
    }

    setInterval(fetchAvailableWiFis, 2000); // Fetch every 5 seconds



  </script>
  <script src="./bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
