<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Connections</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Function to fetch Wi-Fi list every 2 seconds
        function fetchWifiList() {
            setInterval(async () => {
                try {
                    const response = await fetch('https://680fcfc727f2fdac240f7884.mockapi.io/api/get-wifi-list'); // Replace with your server endpoint
                    const wifiList = await response.json();
                    const wifiListContainer = document.getElementById('wifi-list');
                    wifiListContainer.innerHTML = ''; // Clear the list
                    wifiList.forEach(wifi => {
                        const listItem = document.createElement('li');
                        listItem.className = 'list-group-item list-group-item-action';
                        listItem.textContent = wifi.name; // Assuming the server sends an array of objects with a 'name' property
                        listItem.onclick = () => alert(`You clicked on ${wifi.name}`);
                        wifiListContainer.appendChild(listItem);
                    });
                } catch (error) {
                    console.error('Error fetching Wi-Fi list:', error);
                }
            }, 2000);
        }

        // Start fetching Wi-Fi list when the page loads
        window.onload = fetchWifiList;
    </script>

    <style>
        #wifi-list {
            overflow-y: scroll;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#">🌱 Graid Connection Page</a>
        </div>
      </nav>
    <div class="d-flex justify-content-center align-items-center vh-100 ps-2 pe-2">
        <div class="card shadow col-md-10 col-12 h-50">
            <div class="card-body"> 
                <h3 class="card-title">Connect to Wifi</h3>               
                <div class="row mt-4 h-100">
                    <div class="col-md-6 bg-primary">
                        <h5 class="">Available Wi-Fi Networks</h5>
                        <ul id="wifi-list" class="list-group mt-3 h-100">
                            <!-- Wi-Fi list items will be dynamically added here -->
                        </ul>
                    </div>
                    <div class="col-md-6">
                        <h5 class="">Enter Password</h5>
                        <form>
                            <div class=" mb-5 mt-3">
                                <label for="wifi-name" class="form-label">Wi-Fi Name:</label>
                                <p id="selectedWifiName" class="fs-3"></p>
                                <input type="text" id="wifi-name" required hidden>
                            </div>
                            <div class=" mb-3">
                                <label for="wifi-password" class="form-label">Password:</label>
                                <input type="password" class="form-control" id="wifi-password" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Connect</button>                            
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Include Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
